name: Tatchamashay
options:
  bundleIdPrefix: com.tatchamashay
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "2.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Tatchamashay:
    type: application
    platform: iOS
    sources: [Sources]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tatchamashay.app
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_CFBundleDisplayName: Tatchamashay
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Tatchamashay uses your location to show nearby treasure and let you dig it up when you arrive."
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        CODE_SIGNING_ALLOWED: NO
