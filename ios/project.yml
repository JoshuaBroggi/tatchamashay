name: Tatchamashay
options:
  bundleIdPrefix: com.tatchamashay
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "2.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
    # The simulator needs no signing; device builds sign with the family's Apple team.
    "CODE_SIGNING_ALLOWED[sdk=iphonesimulator*]": NO
    DEVELOPMENT_TEAM: RAADXJAY3M
    CODE_SIGN_STYLE: Automatic
packages:
  Yams:
    url: https://github.com/jpsim/Yams
    from: 6.2.0
targets:
  Tatchamashay:
    type: application
    platform: iOS
    sources:
      - Sources
      # Folder references keep the manifest's relative paths (Models/…, Sounds/…) in the bundle.
      - path: Assets/manifest.json
        buildPhase: resources
      - path: Assets/Models
        type: folder
        buildPhase: resources
      - path: Assets/Sounds
        type: folder
        buildPhase: resources
      - path: Assets/Thumbnails
        type: folder
        buildPhase: resources
      - path: Content/Stories
        type: folder
        buildPhase: resources
    dependencies:
      - package: Yams
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tatchamashay.app
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_CFBundleDisplayName: Tatchamashay
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Tatchamashay uses your location during a hunt to show the Dig! button when you reach a treasure. Your location stays on this phone."
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
  TatchamashayTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: Tatchamashay
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.tatchamashay.tests
  TatchamashayUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: Tatchamashay
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.tatchamashay.uitests
        TEST_TARGET_NAME: Tatchamashay
schemes:
  Tatchamashay:
    build:
      targets:
        Tatchamashay: all
        TatchamashayTests: [test]
        TatchamashayUITests: [test]
    test:
      targets: [TatchamashayTests, TatchamashayUITests]
