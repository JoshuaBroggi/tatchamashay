<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Magical reveal</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;800&amp;family=Inter:wght@400;600&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: radial-gradient(circle at 50% 42%, #1F4A4A 0%, #0E1A12 55%, #08110B 100%); font-family: Inter, sans-serif; color: #F8FAEF">
  <div style="position: absolute; left: 35px; top: 180px; width: 320px; height: 320px; border-radius: 50%; border: 2px solid rgba(127,227,240,0.8); box-shadow: 0 0 60px 10px rgba(127,227,240,0.35), inset 0 0 60px rgba(127,227,240,0.3)"></div>
  <div style="position: absolute; left: 75px; top: 220px; width: 240px; height: 240px; border-radius: 50%; border: 1px dashed rgba(127,227,240,0.7)"></div>
  <sc-for list="{{runes}}" as="r" hint-placeholder-count="8">
    <span style="position: absolute; left: {{r.x}}; top: {{r.y}}; font-size: 18px; font-weight: 600; color: #7FE3F0; text-shadow: 0 0 10px #7FE3F0">{{r.g}}</span>
  </sc-for>
  <div style="position: absolute; left: 145px; top: 285px; width: 100px; height: 110px; background: radial-gradient(circle, rgba(212,162,76,0.9), rgba(212,162,76,0) 70%)"></div>
  <div style="position: absolute; left: 130px; top: 300px; width: 130px; height: 90px; border: 1px dashed #E9EFD9; display: flex; align-items: center; justify-content: center; font-size: 11px; letter-spacing: 1px; color: #F8FAEF; text-align: center">TREASURE<br>rises from the ground</div>
  <div style="position: absolute; left: 0; right: 0; top: 70px; text-align: center; font-size: 12px; font-weight: 600; letter-spacing: 5px; color: #7FE3F0">THE RUNES AWAKEN…</div>
  <div style="position: absolute; left: 20px; right: 20px; bottom: 32px; display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center">
    <span style="font-size: 12px; font-weight: 600; letter-spacing: 4px; color: #D4A24C">RARE TREASURE</span>
    <h1 style="margin: 0; font-family: 'Barlow Condensed', sans-serif; font-size: 48px; font-weight: 800; letter-spacing: 1px">THE MILLER'S COIN</h1>
    <p style="margin: 0; font-size: 14px; color: #C3D5B6">Silver, stamped with a waterwheel. Hidden by Emmanuel at Mill Pond.</p>
    <a href="Vault.dc.html" style="display: flex; align-items: center; justify-content: center; width: 100%; height: 56px; margin-top: 8px; background: #D4A24C; color: #0E1A12; font-family: 'Barlow Condensed', sans-serif; font-size: 22px; font-weight: 800; letter-spacing: 2px; text-decoration: none">ADD TO VAULT</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const g = 'ᚠᚢᚦᚨᚱᚲᚷᚹ';
    return { runes: g.split('').map((c, i) => {
      const a = i / 8 * Math.PI * 2;
      return { g: c, x: Math.round(187 + Math.cos(a) * 160) + 'px', y: Math.round(328 + Math.sin(a) * 160) + 'px' };
    }) };
  }
}
</script>
</body>
</html>
