<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Choose expedition</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;800&amp;family=Inter:wght@400;600&amp;display=swap">
<style>body{margin:0}a{color:#C3D5B6}a:hover{color:#FFFFFF}</style>
</helmet>
<div style="width: 1280px; height: 720px; box-sizing: border-box; padding: 40px 56px; display: flex; flex-direction: column; gap: 28px; background: #0E1A12; font-family: Inter, sans-serif; color: #E9EFD9">
  <div style="display: flex; align-items: baseline; justify-content: space-between; border-bottom: 1px solid #2E5236; padding-bottom: 18px">
    <a href="CharacterSelect.dc.html" style="font-size: 15px; font-weight: 600">← Back</a>
    <h1 style="margin: 0; font-family: 'Barlow Condensed', sans-serif; font-size: 44px; font-weight: 800; letter-spacing: 3px; color: #F8FAEF">CHOOSE AN EXPEDITION</h1>
    <span style="font-size: 14px; font-weight: 600; letter-spacing: 2px; color: #D4A24C">STEP 2 / 2</span>
  </div>
  <div style="flex-grow: 1; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px">
    <sc-for list="{{levels}}" as="l" hint-placeholder-count="3">
      <button onClick="{{l.pick}}" style="{{l.style}}">
        <span style="display: block; flex-grow: 1; background: {{l.scene}}"></span>
        <span style="display: flex; flex-direction: column; gap: 8px; padding: 20px; text-align: left; background: #15271B">
          <span style="font-size: 12px; font-weight: 600; letter-spacing: 3px; color: #D4A24C">{{l.region}}</span>
          <span style="font-family: 'Barlow Condensed', sans-serif; font-size: 32px; font-weight: 800; color: #F8FAEF">{{l.name}}</span>
          <span style="font-size: 15px; line-height: 1.45; color: #C3D5B6">{{l.description}}</span>
          <span style="display: flex; gap: 16px; font-size: 13px; font-weight: 600; color: #E9EFD9"><span>{{l.relics}}</span><span>{{l.danger}}</span></span>
        </span>
      </button>
    </sc-for>
  </div>
  <div style="display: flex; justify-content: flex-end; gap: 16px">
    <a href="Lobby.dc.html" style="display: flex; align-items: center; justify-content: center; width: 220px; height: 60px; border: 2px solid #D4A24C; box-sizing: border-box; color: #F8FAEF; font-family: 'Barlow Condensed', sans-serif; font-size: 24px; font-weight: 800; letter-spacing: 2px; text-decoration: none">INVITE CREW</a>
    <a href="HUD.dc.html" style="display: flex; align-items: center; justify-content: center; width: 220px; height: 60px; background: #D4A24C; color: #0E1A12; font-family: 'Barlow Condensed', sans-serif; font-size: 26px; font-weight: 800; letter-spacing: 2px; text-decoration: none">EMBARK</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { picked: 0 }; }
  renderVals() {
    const data = [
      ['ANDES · CLOUD FOREST','The Sunken Temple','Flooded stone halls under a mountain monastery. Find the jade idol before the water rises.','6 relics','Danger ▮▮▯','linear-gradient(#5F7A6A, #2E3B33 60%, #1A221D)'],
      ['SAHARA · DUNE SEA','Tomb of the Salt King','Sand-buried tomb with pressure-plate traps and scorpion nests.','8 relics','Danger ▮▮▮','linear-gradient(#C99A5B, #8A5F2E 60%, #3B2814)'],
      ['BORNEO · RAINFOREST','The Lost Observatory','A vine-choked tower hiding a golden star map. Watch for vipers.','5 relics','Danger ▮▯▯','linear-gradient(#4E6B3A, #26361C 60%, #121A0D)']
    ];
    return { levels: data.map(([region,name,description,relics,danger,scene], i) => ({
      region, name, description, relics, danger, scene,
      pick: () => this.setState({ picked: i }),
      style: 'padding: 0; overflow: hidden; cursor: pointer; font-family: inherit; display: flex; flex-direction: column; background: #15271B; ' + (this.state.picked === i ? 'border: 2px solid #D4A24C' : 'border: 2px solid #2E5236')
    })) };
  }
}
</script>
</body>
</html>
