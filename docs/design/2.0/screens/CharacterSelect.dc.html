<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Choose explorer</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;800&amp;family=Inter:wght@400;600&amp;display=swap">
<style>body{margin:0}a{color:#C3D5B6}a:hover{color:#FFFFFF}</style>
</helmet>
<div style="width: 1280px; height: 720px; box-sizing: border-box; padding: 40px 56px; display: flex; flex-direction: column; gap: 28px; background: #0E1A12; font-family: Inter, sans-serif; color: #E9EFD9">
  <div style="display: flex; align-items: baseline; justify-content: space-between; border-bottom: 1px solid #2E5236; padding-bottom: 18px">
    <a href="Main.dc.html" style="font-size: 15px; font-weight: 600">← Back</a>
    <h1 style="margin: 0; font-family: 'Barlow Condensed', sans-serif; font-size: 44px; font-weight: 800; letter-spacing: 3px; color: #F8FAEF">CHOOSE YOUR EXPLORER</h1>
    <span style="font-size: 14px; font-weight: 600; letter-spacing: 2px; color: #D4A24C">STEP 1 / 2</span>
  </div>
  <div style="flex-grow: 1; display: flex; gap: 36px; min-height: 0">
    <div style="flex: 0 0 470px; display: flex; flex-direction: column; gap: 18px">
      <div style="flex-grow: 1; background: radial-gradient(ellipse at 50% 80%, #2E5236, #15271B); border: 1px solid #2E5236; display: flex; align-items: center; justify-content: center; color: #86A07E; font-size: 14px; letter-spacing: 2px">REALISTIC 3D EXPLORER · TURNTABLE</div>
      <div style="display: flex; flex-direction: column; gap: 6px">
        <span style="font-size: 13px; font-weight: 600; letter-spacing: 3px; color: #D4A24C">{{sel.role}}</span>
        <h2 style="margin: 0; font-family: 'Barlow Condensed', sans-serif; font-size: 44px; font-weight: 800; color: #F8FAEF">{{sel.name}}</h2>
        <p style="margin: 0; font-size: 16px; color: #C3D5B6">{{sel.perk}}</p>
      </div>
    </div>
    <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 24px">
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px">
        <sc-for list="{{list}}" as="c" hint-placeholder-count="6">
          <button onClick="{{c.pick}}" style="{{c.style}}">
            <span style="font-size: 12px; font-weight: 600; letter-spacing: 2px; color: #D4A24C">{{c.role}}</span>
            <span style="font-family: 'Barlow Condensed', sans-serif; font-size: 26px; font-weight: 800; color: #F8FAEF">{{c.name}}</span>
          </button>
        </sc-for>
      </div>
      <div style="display: flex; flex-direction: column; gap: 14px">
        <sc-for list="{{sel.stats}}" as="s" hint-placeholder-count="3">
          <div style="display: flex; align-items: center; gap: 16px">
            <span style="width: 110px; font-size: 13px; font-weight: 600; letter-spacing: 2px; color: #C3D5B6">{{s.label}}</span>
            <span style="flex-grow: 1; height: 8px; background: #1F3826"><span style="display: block; height: 8px; width: {{s.pct}}; background: #D4A24C"></span></span>
          </div>
        </sc-for>
      </div>
    </div>
  </div>
  <div style="display: flex; justify-content: flex-end">
    <a href="LevelSelect.dc.html" style="display: flex; align-items: center; justify-content: center; width: 280px; height: 60px; background: #D4A24C; color: #0E1A12; font-family: 'Barlow Condensed', sans-serif; font-size: 26px; font-weight: 800; letter-spacing: 2px; text-decoration: none">CHOOSE EXPEDITION →</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { picked: 0 }; }
  renderVals() {
    const data = [
      ['SCOUT','Ren Okafor','Spots hidden relics from farther away.',[80,50,60]],
      ['CLIMBER','Mara Voss','Scales cliffs and temple walls others can’t.',[60,90,50]],
      ['CARTOGRAPHER','Theo Lind','Reveals the map and secret passages for the crew.',[50,40,95]],
      ['DIVER','Isla Reyes','Holds breath longer in flooded caves.',[70,70,60]],
      ['ENGINEER','Kai Brandt','Disarms traps and opens sealed doors faster.',[55,60,80]],
      ['MEDIC','Noor Haddad','Revives fallen crew and cures snake bites.',[65,50,70]]
    ];
    const list = data.map(([role,name,perk,v], i) => ({
      role, name, perk,
      stats: [{label:'SPEED',pct:v[0]+'%'},{label:'CLIMB',pct:v[1]+'%'},{label:'INSIGHT',pct:v[2]+'%'}],
      pick: () => this.setState({ picked: i }),
      style: 'height: 92px; padding: 14px 16px; display: flex; flex-direction: column; align-items: flex-start; justify-content: center; gap: 4px; cursor: pointer; font-family: inherit; text-align: left; background: #15271B; ' + (this.state.picked === i ? 'border: 2px solid #D4A24C' : 'border: 2px solid #2E5236')
    }));
    return { list, sel: list[this.state.picked] };
  }
}
</script>
</body>
</html>
