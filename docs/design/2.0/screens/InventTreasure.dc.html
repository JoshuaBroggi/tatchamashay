<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Invent and bury a treasure</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;800&amp;family=Inter:wght@400;600&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 20px 16px; display: flex; flex-direction: column; gap: 14px; background: #0E1A12; font-family: Inter, sans-serif; color: #F8FAEF">
  <div style="display: flex; flex-direction: column; gap: 4px">
    <span style="font-size: 12px; font-weight: 600; letter-spacing: 3px; color: #E9A3C9">TREASURE MAKER</span>
    <h1 style="margin: 0; font-family: 'Barlow Condensed', sans-serif; font-size: 36px; font-weight: 800">Invent a treasure</h1>
    <span style="font-size: 13px; color: #C3D5B6">Created by Emmanuel</span>
  </div>
  <div style="display: flex; gap: 12px">
    <div style="width: 120px; height: 120px; border: 1px dashed #86A07E; display: flex; align-items: center; justify-content: center; text-align: center; font-size: 12px; color: #C3D5B6">Draw it or<br>take a photo</div>
    <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 6px">
      <label for="tname" style="font-size: 12px; font-weight: 600; color: #C3D5B6">Name</label>
      <input id="tname" value="The Owl's Feather" style="height: 44px; padding: 0 12px; border: 1px solid #4E7A4A; background: #15271B; color: #F8FAEF; font-family: inherit; font-size: 15px">
      <span style="font-size: 12px; font-weight: 600; color: #C3D5B6">Rarity</span>
      <div style="display: flex; gap: 6px">
        <sc-for list="{{rar}}" as="r" hint-placeholder-count="3">
          <button onClick="{{r.pick}}" style="{{r.style}}">{{r.label}}</button>
        </sc-for>
      </div>
    </div>
  </div>
  <label for="story" style="font-size: 12px; font-weight: 600; color: #C3D5B6">Its story</label>
  <textarea id="story" style="height: 70px; padding: 10px 12px; border: 1px solid #4E7A4A; background: #15271B; color: #F8FAEF; font-family: inherit; font-size: 14px; resize: none">Dropped by the great owl who guards the old oak.</textarea>
  <label for="clue" style="font-size: 12px; font-weight: 600; color: #C3D5B6">Clue for finders</label>
  <input id="clue" value="Look up where the owl sleeps." style="height: 44px; padding: 0 12px; border: 1px solid #4E7A4A; background: #15271B; color: #F8FAEF; font-family: inherit; font-size: 14px">
  <div style="flex-grow: 1; position: relative; border: 1px solid #2E5236; background: #15271B; overflow: hidden">
    <div style="position: absolute; left: 0; right: 0; top: 60px; height: 16px; background: rgba(134,160,126,0.25)"></div>
    <div style="position: absolute; left: 120px; top: 0; bottom: 0; width: 14px; background: rgba(134,160,126,0.25)"></div>
    <span style="position: absolute; left: 168px; top: 40px; width: 26px; height: 26px; border-radius: 50% 50% 50% 0; transform: rotate(-45deg); background: #E9A3C9; box-shadow: 0 0 16px rgba(233,163,201,0.7)"></span>
    <span style="position: absolute; left: 10px; bottom: 8px; font-size: 12px; color: #C3D5B6">Bury it right here · Oak Park, 2 m accuracy</span>
  </div>
  <a href="Vault.dc.html" style="display: flex; align-items: center; justify-content: center; height: 56px; background: #D4A24C; color: #0E1A12; font-family: 'Barlow Condensed', sans-serif; font-size: 22px; font-weight: 800; letter-spacing: 2px; text-decoration: none">BURY &amp; LOG TREASURE</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { r: 'Rare' }; }
  renderVals() {
    return { rar: ['Common','Rare','Legend'].map(label => ({ label,
      pick: () => this.setState({ r: label }),
      style: 'flex: 1; height: 36px; font-family: inherit; font-size: 12px; font-weight: 600; cursor: pointer; ' + (this.state.r === label ? 'background: #E9A3C9; color: #0E1A12; border: 0' : 'background: transparent; color: #C3D5B6; border: 1px solid #2E5236')
    })) };
  }
}
</script>
</body>
</html>
