<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Treasure vault</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;800&amp;family=Inter:wght@400;600&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 20px 16px; display: flex; flex-direction: column; gap: 16px; background: #0E1A12; font-family: Inter, sans-serif; color: #F8FAEF">
  <div style="display: flex; flex-direction: column; gap: 4px">
    <span style="font-size: 12px; font-weight: 600; letter-spacing: 3px; color: #D4A24C">MY VAULT</span>
    <h1 style="margin: 0; font-family: 'Barlow Condensed', sans-serif; font-size: 40px; font-weight: 800">23 treasures</h1>
    <span style="font-size: 13px; color: #C3D5B6">Worth 18,400 · 3 legendary</span>
  </div>
  <div style="display: flex; gap: 8px; flex-wrap: wrap">
    <sc-for list="{{tabs}}" as="t" hint-placeholder-count="4">
      <button onClick="{{t.pick}}" style="{{t.style}}">{{t.label}}</button>
    </sc-for>
  </div>
  <div style="flex-grow: 1; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; align-content: start">
    <sc-for list="{{items}}" as="i" hint-placeholder-count="12">
      <div style="{{i.box}}">
        <span style="flex-grow: 1; background: {{i.glow}}"></span>
        <span style="font-size: 11px; font-weight: 600; color: #F8FAEF">{{i.name}}</span>
        <span style="font-size: 10px; color: {{i.color}}">{{i.rarity}}</span>
      </div>
    </sc-for>
  </div>
  <div style="display: flex; gap: 10px">
    <a href="PirateMap.dc.html" style="flex: 1; display: flex; align-items: center; justify-content: center; height: 52px; border: 1px solid #4E7A4A; color: #F8FAEF; font-size: 14px; font-weight: 600; text-decoration: none">Map</a>
    <a href="InventTreasure.dc.html" style="flex: 2; display: flex; align-items: center; justify-content: center; height: 52px; background: #D4A24C; color: #0E1A12; font-family: 'Barlow Condensed', sans-serif; font-size: 20px; font-weight: 800; letter-spacing: 2px; text-decoration: none">INVENT A TREASURE</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { tab: 'All' }; }
  renderVals() {
    const tabs = ['All','Found','Invented','Legendary'].map(label => ({ label,
      pick: () => this.setState({ tab: label }),
      style: 'height: 36px; padding: 0 14px; font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer; ' + (this.state.tab === label ? 'background: #F8FAEF; color: #0E1A12; border: 0' : 'background: transparent; color: #C3D5B6; border: 1px solid #2E5236')
    }));
    const R = { L: ['LEGENDARY','#D4A24C','radial-gradient(circle,rgba(212,162,76,0.7),rgba(212,162,76,0) 70%)'], A: ['RARE','#7FE3F0','radial-gradient(circle,rgba(127,227,240,0.55),rgba(127,227,240,0) 70%)'], C: ['COMMON','#86A07E','radial-gradient(circle,rgba(134,160,126,0.4),rgba(134,160,126,0) 70%)'], I: ['INVENTED','#E9A3C9','radial-gradient(circle,rgba(233,163,201,0.5),rgba(233,163,201,0) 70%)'] };
    const items = [['Miller’s coin','A'],['Jade idol','L'],['Rune stone','A'],['Old key','C'],['Owl feather','I'],['Gold mask','L'],['Bottle map','C'],['Fox totem','I'],['Star coin','A'],['Bronze bell','C'],['Moon pearl','L'],['?','C']].map(([name,k]) => ({ name, rarity: R[k][0], color: R[k][1], glow: R[k][2],
      box: 'height: 118px; display: flex; flex-direction: column; gap: 2px; padding: 8px; box-sizing: border-box; background: #15271B; border: 1px solid ' + (k === 'L' ? '#D4A24C' : '#2E5236') }));
    return { tabs, items };
  }
}
</script>
</body>
</html>
