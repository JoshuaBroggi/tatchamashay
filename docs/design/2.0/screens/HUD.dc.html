<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>In-game overlay</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;800&amp;family=Inter:wght@400;600&amp;display=swap">
<style>body{margin:0}.scene{background:linear-gradient(rgba(8,17,11,0.25),rgba(8,17,11,0) 30%,rgba(8,17,11,0) 70%,rgba(8,17,11,0.45)),url(../assets/forest-ruins-reference.webp) center/cover}</style>
</helmet>
<div class="scene" style="width: 1280px; height: 720px; position: relative; overflow: hidden; font-family: Inter, sans-serif; color: #F8FAEF">
  <div style="position: absolute; left: 590px; top: 330px; width: 100px; height: 140px; border: 1px dashed #86A07E; display: flex; align-items: center; justify-content: center; font-size: 11px; color: #C3D5B6; text-align: center">3D explorer<br>(3rd person)</div>
  <div style="position: absolute; left: 24px; top: 24px; display: flex; flex-direction: column; gap: 10px; background: rgba(8,17,11,0.7); padding: 16px 18px; width: 260px">
    <span style="font-size: 12px; font-weight: 600; letter-spacing: 3px; color: #D4A24C">THE SUNKEN TEMPLE</span>
    <span style="font-size: 15px">Find the jade idol <span style="color: #C3D5B6">· 2 / 6 relics</span></span>
    <div style="display: flex; align-items: center; gap: 10px"><span style="font-size: 12px; color: #C3D5B6; width: 54px">HEALTH</span><span style="flex-grow: 1; height: 6px; background: #2E5236"><span style="display: block; width: 72%; height: 6px; background: #6FCF97"></span></span></div>
    <div style="display: flex; align-items: center; gap: 10px"><span style="font-size: 12px; color: #C3D5B6; width: 54px">AIR</span><span style="flex-grow: 1; height: 6px; background: #2E5236"><span style="display: block; width: 40%; height: 6px; background: #7FE3F0"></span></span></div>
  </div>
  <div style="position: absolute; right: 24px; top: 24px; display: flex; gap: 12px; align-items: flex-start">
    <div style="background: rgba(8,17,11,0.7); padding: 12px 18px; display: flex; flex-direction: column; align-items: flex-end">
      <span style="font-size: 12px; font-weight: 600; letter-spacing: 3px; color: #C3D5B6">TREASURE</span>
      <span style="font-family: 'Barlow Condensed', sans-serif; font-size: 36px; font-weight: 800; color: #D4A24C">4,250</span>
    </div>
    <button aria-label="Pause" style="width: 52px; height: 52px; border: 1px solid #4E7A4A; background: rgba(8,17,11,0.7); color: #F8FAEF; cursor: pointer; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M5 3v12M13 3v12" stroke="#F8FAEF" stroke-width="2.5" fill="none"></path></svg></button>
  </div>
  <div style="position: absolute; right: 24px; top: 120px; width: 180px; height: 180px; border-radius: 50%; background: rgba(8,17,11,0.75); border: 1px solid #4E7A4A; display: flex; align-items: center; justify-content: center; font-size: 11px; letter-spacing: 2px; color: #86A07E">MINIMAP</div>
  <div style="position: absolute; left: 24px; bottom: 24px; display: flex; flex-direction: column; gap: 8px">
    <span style="font-size: 12px; font-weight: 600; letter-spacing: 3px; color: #C3D5B6">CREW</span>
    <span style="font-size: 14px"><span style="color: #6FCF97">●</span> jadefox · Climber · 40 m north</span>
    <span style="font-size: 14px"><span style="color: #E67E22">●</span> River · Medic · needs help</span>
  </div>
  <div style="position: absolute; left: 50%; bottom: 140px; transform: translateX(-50%); background: rgba(8,17,11,0.8); border: 1px solid #D4A24C; padding: 10px 20px; font-size: 15px"><span style="font-weight: 600; color: #D4A24C">[E]</span> Pry open stone chest</div>
  <div style="position: absolute; left: 50%; bottom: 24px; transform: translateX(-50%); display: flex; gap: 8px">
    <sc-for list="{{slots}}" as="s" hint-placeholder-count="5">
      <div style="{{s.box}}"><span style="font-size: 11px; color: #86A07E">{{s.key}}</span><span style="font-size: 12px; font-weight: 600">{{s.item}}</span></div>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {
  renderVals() {
    const base = 'width: 84px; height: 72px; background: rgba(8,17,11,0.75); display: flex; flex-direction: column; justify-content: space-between; padding: 8px; box-sizing: border-box; ';
    return { slots: [['1','Torch',true],['2','Rope',false],['3','Brush',false],['4','Map',false],['5','—',false]].map(([key,item,on]) => ({ key, item, box: base + (on ? 'border: 2px solid #D4A24C' : 'border: 1px solid #2E5236') })) };
  }
}
</script>
</body>
</html>
