<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Crew lobby</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;800&amp;family=Inter:wght@400;600&amp;display=swap">
<style>body{margin:0}a{color:#C3D5B6}a:hover{color:#FFFFFF}</style>
</helmet>
<div style="width: 1280px; height: 720px; box-sizing: border-box; padding: 40px 56px; display: flex; flex-direction: column; gap: 28px; background: #0E1A12; font-family: Inter, sans-serif; color: #E9EFD9">
  <div style="display: flex; align-items: baseline; justify-content: space-between; border-bottom: 1px solid #2E5236; padding-bottom: 18px">
    <a href="Main.dc.html" style="font-size: 15px; font-weight: 600">← Leave crew</a>
    <h1 style="margin: 0; font-family: 'Barlow Condensed', sans-serif; font-size: 44px; font-weight: 800; letter-spacing: 3px; color: #F8FAEF">BASE CAMP</h1>
    <span style="font-size: 14px; font-weight: 600; letter-spacing: 2px; color: #6FCF97">● CONNECTED</span>
  </div>
  <div style="flex-grow: 1; display: flex; gap: 36px">
    <div style="flex: 0 0 360px; display: flex; flex-direction: column; gap: 20px">
      <div style="border: 1px solid #2E5236; background: #15271B; padding: 24px; display: flex; flex-direction: column; gap: 10px">
        <span style="font-size: 12px; font-weight: 600; letter-spacing: 3px; color: #C3D5B6">CREW CODE</span>
        <span style="font-family: 'Barlow Condensed', sans-serif; font-size: 80px; font-weight: 800; letter-spacing: 16px; color: #D4A24C">K7QX</span>
        <button style="height: 46px; border: 1px solid #D4A24C; background: transparent; color: #F8FAEF; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer">Copy invite link</button>
      </div>
      <div style="border: 1px solid #2E5236; background: #15271B; padding: 24px; display: flex; flex-direction: column; gap: 10px">
        <label for="code" style="font-size: 12px; font-weight: 600; letter-spacing: 3px; color: #C3D5B6">JOIN ANOTHER CREW</label>
        <div style="display: flex; gap: 10px">
          <input id="code" placeholder="ABCD" maxlength="4" style="flex-grow: 1; min-width: 0; height: 50px; border: 1px solid #4E7A4A; background: #0E1A12; color: #F8FAEF; font-family: 'Barlow Condensed', sans-serif; font-size: 26px; letter-spacing: 10px; text-align: center; text-transform: uppercase">
          <button style="height: 50px; padding: 0 22px; border: 0; background: #D4A24C; color: #0E1A12; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer">Join</button>
        </div>
      </div>
      <div style="border: 1px solid #2E5236; padding: 18px 24px; font-size: 14px; line-height: 1.5; color: #C3D5B6">Expedition: <span style="color: #F8FAEF; font-weight: 600">The Sunken Temple</span><br>Leader picks the expedition and starts.</div>
    </div>
    <div style="flex-grow: 1; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px">
      <sc-for list="{{crew}}" as="m" hint-placeholder-count="4">
        <div style="{{m.box}}">
          <span style="font-size: 12px; font-weight: 600; letter-spacing: 3px; color: #D4A24C">{{m.role}}</span>
          <span style="font-family: 'Barlow Condensed', sans-serif; font-size: 34px; font-weight: 800; color: #F8FAEF">{{m.name}}</span>
          <span style="font-size: 14px; color: {{m.statusColor}}">{{m.status}}</span>
        </div>
      </sc-for>
    </div>
  </div>
  <div style="display: flex; align-items: center; justify-content: space-between">
    <span style="font-size: 14px; color: #C3D5B6">2 of 4 explorers · each role can only be picked once</span>
    <a href="HUD.dc.html" style="display: flex; align-items: center; justify-content: center; width: 260px; height: 60px; background: #D4A24C; color: #0E1A12; font-family: 'Barlow Condensed', sans-serif; font-size: 26px; font-weight: 800; letter-spacing: 2px; text-decoration: none">START EXPEDITION</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {
  renderVals() {
    const full = 'padding: 24px; display: flex; flex-direction: column; justify-content: flex-end; gap: 6px; background: linear-gradient(#1F3826, #15271B); border: 1px solid #4E7A4A';
    const open = 'padding: 24px; display: flex; flex-direction: column; justify-content: flex-end; gap: 6px; border: 1px dashed #2E5236';
    return { crew: [
      { role: 'CARTOGRAPHER · LEADER', name: 'You', status: 'Ready', statusColor: '#6FCF97', box: full },
      { role: 'CLIMBER', name: 'jadefox', status: 'Choosing gear…', statusColor: '#C3D5B6', box: full },
      { role: 'OPEN SLOT', name: '—', status: 'Waiting for an explorer', statusColor: '#86A07E', box: open },
      { role: 'OPEN SLOT', name: '—', status: 'Waiting for an explorer', statusColor: '#86A07E', box: open }
    ] };
  }
}
</script>
</body>
</html>
