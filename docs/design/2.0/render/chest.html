<!doctype html><html><head><meta charset="utf-8"></head><body style="margin:0;background:#000">
<script type="importmap">{"imports":{"three":"/nm/three/build/three.module.js","three/addons/":"/nm/three/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {DRACOLoader} from 'three/addons/loaders/DRACOLoader.js';
import {EffectComposer} from 'three/addons/postprocessing/EffectComposer.js';
import {RenderPass} from 'three/addons/postprocessing/RenderPass.js';
import {UnrealBloomPass} from 'three/addons/postprocessing/UnrealBloomPass.js';
import {OutputPass} from 'three/addons/postprocessing/OutputPass.js';
import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';

const W=780,H=1688;
const r=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});
r.setSize(W,H); r.setPixelRatio(1); r.toneMapping=THREE.ACESFilmicToneMapping; r.toneMappingExposure=1.0;
r.shadowMap.enabled=true; r.shadowMap.type=THREE.PCFSoftShadowMap; document.body.appendChild(r.domElement);
const pm=new THREE.PMREMGenerator(r);
const envTex=pm.fromScene(new RoomEnvironment(),0.04).texture;

// ---------- procedural textures ----------
function rand(s){return ()=>{s=(s*16807)%2147483647;return (s-1)/2147483646;};}
function woodCanvas(seed,planks){
  const c=document.createElement('canvas');c.width=1024;c.height=1024;const g=c.getContext('2d');const R=rand(seed);
  const ph=1024/planks;
  for(let p=0;p<planks;p++){
    const base=[88+R()*30,52+R()*16,26+R()*10];
    g.fillStyle=`rgb(${base[0]|0},${base[1]|0},${base[2]|0})`;g.fillRect(0,p*ph,1024,ph);
    for(let i=0;i<140;i++){ // grain
      const y=p*ph+R()*ph, a=0.05+R()*0.18, d=R()<0.5;
      g.strokeStyle=d?`rgba(30,15,5,${a})`:`rgba(160,110,60,${a*0.7})`;g.lineWidth=0.6+R()*1.8;
      g.beginPath();g.moveTo(0,y);
      for(let x=0;x<=1024;x+=32)g.lineTo(x,y+Math.sin(x*0.01+R()*0.4+p)*3*R());
      g.stroke();
    }
    for(let k=0;k<2;k++){ // knots
      const x=R()*1024,y=p*ph+ph*(0.3+R()*0.4);
      for(let j=10;j>0;j--){g.strokeStyle=`rgba(35,18,6,${0.12})`;g.lineWidth=1.5;g.beginPath();g.ellipse(x,y,j*3.2,j*1.3,0,0,7);g.stroke();}
    }
    g.fillStyle='rgba(12,6,2,0.9)';g.fillRect(0,p*ph,1024,4); // seam
    g.fillStyle='rgba(0,0,0,0.25)';g.fillRect(0,p*ph+4,1024,3);
  }
  for(let i=0;i<9000;i++){g.fillStyle=`rgba(0,0,0,${R()*0.08})`;g.fillRect(R()*1024,R()*1024,2,2);} // grime
  const gr=g.createLinearGradient(0,0,0,1024);gr.addColorStop(0,'rgba(0,0,0,0)');gr.addColorStop(1,'rgba(40,30,10,0.35)');g.fillStyle=gr;g.fillRect(0,0,1024,1024); // dirt at bottom
  for(let i=0;i<40;i++){g.fillStyle=`rgba(70,95,40,${0.08+R()*0.15})`;g.beginPath();g.arc(R()*1024,900+R()*124,8+R()*30,0,7);g.fill();} // moss
  const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=8;return t;
}
function roughCanvas(){const c=document.createElement('canvas');c.width=c.height=256;const g=c.getContext('2d');const R=rand(7);
  g.fillStyle='#d0d0d0';g.fillRect(0,0,256,256);for(let i=0;i<4000;i++){const v=150+R()*105|0;g.fillStyle=`rgb(${v},${v},${v})`;g.fillRect(R()*256,R()*256,2,1);}return new THREE.CanvasTexture(c);}
function ironCanvas(){const c=document.createElement('canvas');c.width=c.height=256;const g=c.getContext('2d');const R=rand(3);
  g.fillStyle='#3a3530';g.fillRect(0,0,256,256);
  for(let i=0;i<600;i++){g.fillStyle=`rgba(${120+R()*60|0},${60+R()*30|0},20,${R()*0.35})`;g.beginPath();g.arc(R()*256,R()*256,1+R()*6,0,7);g.fill();} // rust
  for(let i=0;i<2000;i++){g.fillStyle=`rgba(0,0,0,${R()*0.3})`;g.fillRect(R()*256,R()*256,1,1);}
  const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;t.wrapS=t.wrapT=THREE.RepeatWrapping;return t;}
function runeCanvas(txt){const c=document.createElement('canvas');c.width=1024;c.height=128;const g=c.getContext('2d');
  g.fillStyle='#000';g.fillRect(0,0,1024,128);g.font='bold 92px serif';g.textAlign='center';g.textBaseline='middle';
  g.fillStyle='#fff';g.fillText(txt,512,68);const t=new THREE.CanvasTexture(c);return t;}
function dirtCanvas(){const c=document.createElement('canvas');c.width=c.height=1024;const g=c.getContext('2d');const R=rand(11);
  g.fillStyle='#4a3420';g.fillRect(0,0,1024,1024);
  for(let i=0;i<30000;i++){const v=R();g.fillStyle=v<0.5?`rgba(30,18,8,${R()*0.5})`:`rgba(140,105,65,${R()*0.35})`;g.fillRect(R()*1024,R()*1024,1+R()*4,1+R()*4);}
  for(let i=0;i<300;i++){g.fillStyle=`rgba(${80+R()*60|0},${110+R()*50|0},50,${0.3+R()*0.4})`;g.beginPath();g.ellipse(R()*1024,R()*1024,2,8+R()*10,R()*3,0,7);g.fill();} // grass bits
  const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(3,3);return t;}
function glowSprite(col){const c=document.createElement('canvas');c.width=c.height=128;const g=c.getContext('2d');
  const gr=g.createRadialGradient(64,64,0,64,64,64);gr.addColorStop(0,'rgba(255,255,255,1)');gr.addColorStop(0.25,col);gr.addColorStop(1,'rgba(0,0,0,0)');
  g.fillStyle=gr;g.fillRect(0,0,128,128);return new THREE.CanvasTexture(c);}

const wood=new THREE.MeshStandardMaterial({map:woodCanvas(5,5),roughnessMap:roughCanvas(),roughness:0.85,metalness:0,envMapIntensity:0.5});
const woodLid=new THREE.MeshStandardMaterial({map:woodCanvas(9,7),roughnessMap:roughCanvas(),roughness:0.85,metalness:0,envMapIntensity:0.5});
const iron=new THREE.MeshStandardMaterial({map:ironCanvas(),color:0x9a928a,metalness:0.85,roughness:0.5,envMap:envTex,envMapIntensity:0.9});
const brass=new THREE.MeshStandardMaterial({color:0xc9973c,metalness:1,roughness:0.28,envMap:envTex,envMapIntensity:1.4});
const innerDark=new THREE.MeshStandardMaterial({color:0x1a0f06,roughness:1});

// ---------- scene ----------
async function build(o){
  const s=new THREE.Scene();
  const bg=await new THREE.TextureLoader().loadAsync('/design/assets/forest-ruins-reference.webp');bg.colorSpace=THREE.SRGBColorSpace;
  // crop bg to portrait: center-right on the tower/path
  const a=(W/H)/(1766/872);bg.repeat.set(a,1);bg.offset.set(0.5-a/2+0.06,0);s.background=bg;
  s.backgroundIntensity=o.bgI??0.75;
  s.fog=new THREE.Fog(0x40583c,9,22);

  s.add(new THREE.HemisphereLight(0xcfe8d0,0x3a2a14,0.9));
  const sun=new THREE.DirectionalLight(0xffdca0,2.6);sun.position.set(3,6,2.5);sun.castShadow=true;
  sun.shadow.mapSize.set(2048,2048);sun.shadow.camera.left=-3;sun.shadow.camera.right=3;sun.shadow.camera.top=3;sun.shadow.camera.bottom=-3;sun.shadow.bias=-0.0005;sun.shadow.radius=6;s.add(sun);
  const rim=new THREE.DirectionalLight(0x9fe8ff,1.4);rim.position.set(-3,2.5,-3);s.add(rim);

  // ground + dig hole
  const am=document.createElement('canvas');am.width=am.height=256;{const q=am.getContext('2d');const gg=q.createRadialGradient(128,128,50,128,128,128);gg.addColorStop(0,'#fff');gg.addColorStop(1,'#000');q.fillStyle=gg;q.fillRect(0,0,256,256);}
  const gm=new THREE.MeshStandardMaterial({map:dirtCanvas(),roughness:1,alphaMap:new THREE.CanvasTexture(am),transparent:true});
  const ground=new THREE.Mesh(new THREE.CircleGeometry(4.2,96),gm);ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;s.add(ground);
  const hole=new THREE.Mesh(new THREE.CircleGeometry(1.15,64),new THREE.MeshStandardMaterial({color:0x1c120a,roughness:1}));
  hole.rotation.x=-Math.PI/2;hole.position.y=0.003;hole.scale.set(1.25,0.9,1);s.add(hole);
  // dirt mound ring + clods
  const R=rand(42);
  for(let i=0;i<70;i++){const ang=R()*Math.PI*2, d=1.25+R()*0.55;
    const cl=new THREE.Mesh(new THREE.DodecahedronGeometry(0.025+R()*0.06,1),new THREE.MeshStandardMaterial({color:new THREE.Color().setHSL(0.07,0.5,0.025+R()*0.03),roughness:1}));
    cl.position.set(Math.cos(ang)*d*1.25,0.02+R()*0.06,Math.sin(ang)*d*0.9);cl.rotation.set(R()*3,R()*3,R()*3);cl.scale.y=0.6;cl.castShadow=cl.receiveShadow=true;s.add(cl);}
  for(let i=0;i<0;i++){const st=new THREE.Mesh(new THREE.DodecahedronGeometry(0.06+R()*0.1,0),new THREE.MeshStandardMaterial({color:0x6d6a60,roughness:0.95}));
    const ang=R()*Math.PI*2,d=1.9+R()*1.2;st.position.set(Math.cos(ang)*d,0.05,Math.sin(ang)*d);st.rotation.set(R()*3,R()*3,R()*3);st.castShadow=st.receiveShadow=true;s.add(st);}
  // shovel stuck in ground
  const sh=new THREE.Group();
  const handle=new THREE.Mesh(new THREE.CylinderGeometry(0.025,0.025,1.3,12),new THREE.MeshStandardMaterial({color:0x7a5532,roughness:0.7}));handle.position.y=0.65;sh.add(handle);
  const blade=new THREE.Mesh(new THREE.BoxGeometry(0.22,0.28,0.015),iron);blade.position.y=-0.05;sh.add(blade);
  sh.position.set(1.75,0.1,-0.3);sh.rotation.set(0.15,0.6,-0.32);sh.traverse(m=>m.castShadow=true);s.add(sh);

  // ---------- chest ----------
  const C=new THREE.Group();const Wd=1.2,D=0.72,Hb=0.58,rad=D/2;
  const body=new THREE.Mesh(new THREE.BoxGeometry(Wd,Hb,D),wood);body.position.y=Hb/2;body.castShadow=body.receiveShadow=true;C.add(body);
  const inner=new THREE.Mesh(new THREE.BoxGeometry(Wd-0.08,0.02,D-0.08),innerDark);inner.position.y=Hb-0.005;C.add(inner);
  // corner posts + bands
  for(const x of [-1,1])for(const z of [-1,1]){const p=new THREE.Mesh(new THREE.BoxGeometry(0.07,Hb+0.01,0.07),iron);p.position.set(x*(Wd/2-0.02),Hb/2,z*(D/2-0.02));p.castShadow=true;C.add(p);}
  for(const x of [-0.36,0.36]){const b=new THREE.Mesh(new THREE.BoxGeometry(0.08,Hb+0.012,D+0.016),iron);b.position.set(x,Hb/2,0);b.castShadow=true;C.add(b);}
  const hb=new THREE.Mesh(new THREE.BoxGeometry(Wd+0.016,0.07,D+0.016),iron);hb.position.y=0.06;C.add(hb);
  const tb=new THREE.Mesh(new THREE.BoxGeometry(Wd+0.016,0.06,D+0.016),iron);tb.position.y=Hb-0.035;C.add(tb);
  // rivets
  const rv=new THREE.SphereGeometry(0.014,10,8);
  for(const x of [-0.36,0.36])for(let y=0.1;y<Hb-0.05;y+=0.09){const m=new THREE.Mesh(rv,iron);m.position.set(x,y,D/2+0.012);C.add(m);}
  for(let x=-0.55;x<=0.55;x+=0.11){for(const y of [0.06,Hb-0.035]){const m=new THREE.Mesh(rv,iron);m.position.set(x,y,D/2+0.012);C.add(m);}}
  // handles
  for(const x of [-1,1]){const h=new THREE.Mesh(new THREE.TorusGeometry(0.08,0.014,10,24,Math.PI),iron);h.position.set(x*(Wd/2+0.03),Hb*0.62,0);h.rotation.set(0,Math.PI/2,Math.PI);h.castShadow=true;C.add(h);}
  // rune strip (emissive) on front band area
  const runeMat=new THREE.MeshBasicMaterial({map:runeCanvas('ᚠ ᚢ ᚦ ᚨ ᚱ ᚲ ᚷ'),color:new THREE.Color(0x7fe3f0).multiplyScalar(o.rune),transparent:true,blending:THREE.AdditiveBlending,depthWrite:false});
  const rs=new THREE.Mesh(new THREE.PlaneGeometry(0.62,0.08),runeMat);rs.position.set(-0.0,0.2,D/2+0.009);C.add(rs);
  // lock plate
  const lp=new THREE.Mesh(new THREE.BoxGeometry(0.16,0.2,0.025),brass);lp.position.set(0,Hb-0.08,D/2+0.02);lp.castShadow=true;C.add(lp);
  const kh=new THREE.Mesh(new THREE.CylinderGeometry(0.018,0.018,0.03,16),innerDark);kh.rotation.x=Math.PI/2;kh.position.set(0,Hb-0.07,D/2+0.03);C.add(kh);
  // inner glow
  if(o.open>0){
    const glowPlane=new THREE.Mesh(new THREE.PlaneGeometry(Wd-0.1,D-0.1),new THREE.MeshBasicMaterial({color:new THREE.Color(0xffd890).multiplyScalar(3.5*o.glow)}));
    glowPlane.rotation.x=-Math.PI/2;glowPlane.position.y=Hb-0.02;C.add(glowPlane);
    const pl=new THREE.PointLight(0xffc770,14*o.glow,6,1.6);pl.position.set(0,Hb+0.25,0);C.add(pl);
    const pl2=new THREE.PointLight(0x7fe3f0,6*o.glow,5,1.6);pl2.position.set(0,Hb+0.9,0.3);C.add(pl2);
    // god-ray cone
    const cone=new THREE.Mesh(new THREE.CylinderGeometry(0.95,0.5,3.2,48,1,true),new THREE.ShaderMaterial({transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,side:THREE.DoubleSide,
      uniforms:{k:{value:o.glow}},vertexShader:'varying vec2 u;varying vec3 n;varying vec3 v;void main(){u=uv;n=normalize(normalMatrix*normal);vec4 mv=modelViewMatrix*vec4(position,1.);v=normalize(-mv.xyz);gl_Position=projectionMatrix*mv;}',
      fragmentShader:'varying vec2 u;varying vec3 n;varying vec3 v;uniform float k;void main(){float f=pow(abs(dot(n,v)),2.);float a=(1.-u.y)*0.0+u.y;a=pow(1.-u.y,0.0)*smoothstep(1.,0.,u.y);gl_FragColor=vec4(vec3(1.,.86,.55)*f*smoothstep(0.,1.,1.-u.y)*0.16*k,1.);}'}));
    cone.position.y=Hb+1.6;C.add(cone);
  }
  // lid (half cylinder, hinged at back)
  const lid=new THREE.Group();lid.position.set(0,Hb,-D/2);
  const lidInner=new THREE.Group();lidInner.position.set(0,0,D/2);lid.add(lidInner);
  const cyl=new THREE.Mesh(new THREE.CylinderGeometry(rad,rad,Wd,48,1,false,0,Math.PI),woodLid);cyl.rotation.z=Math.PI/2;cyl.castShadow=cyl.receiveShadow=true;lidInner.add(cyl);
  for(const x of [-0.36,0.36,-Wd/2+0.03,Wd/2-0.03]){const band=new THREE.Mesh(new THREE.CylinderGeometry(rad+0.012,rad+0.012,0.08,48,1,true,0,Math.PI),iron);band.rotation.z=Math.PI/2;band.position.x=x;band.castShadow=true;lidInner.add(band);
    for(let t=0.15;t<Math.PI;t+=0.35){const m=new THREE.Mesh(rv,iron);m.position.set(x,Math.sin(t)*(rad+0.02),Math.cos(t)*(rad+0.02));lidInner.add(m);}}
  const lidRune=new THREE.Mesh(new THREE.PlaneGeometry(0.5,0.07),runeMat);lidRune.position.set(0,rad*0.72,rad*0.72);lidRune.rotation.x=-Math.PI/4;lidInner.add(lidRune);
  const hasp=new THREE.Mesh(new THREE.BoxGeometry(0.1,0.16,0.02),brass);hasp.position.set(0,-0.02,rad+0.015);lidInner.add(hasp);
  lid.rotation.x=-o.open;C.add(lid);
  C.position.y=o.sink;C.rotation.y=o.yaw??-0.32;s.add(C);
  // fix lid end caps orientation (semicircle on top half)
  

  // particles
  if(o.particles){
    const mk=(n,col,size,spread,yb)=>{const g=new THREE.BufferGeometry();const p=[];const R2=rand(o.seed||3);
      for(let i=0;i<n;i++){const t=R2();p.push((R2()-0.5)*spread*(0.3+t),yb+t*2.8,(R2()-0.5)*spread*0.6*(0.3+t));}
      g.setAttribute('position',new THREE.Float32BufferAttribute(p,3));
      return new THREE.Points(g,new THREE.PointsMaterial({map:glowSprite(col),size,transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,color:0xffffff}));};
    const g1=mk(o.particles,'rgba(255,200,110,0.9)',0.07,1.6,Hb+o.sink);g1.rotation.y=C.rotation.y;s.add(g1);
    const g2=mk(o.particles*0.6|0,'rgba(127,227,240,0.9)',0.09,2.2,Hb+o.sink+0.1);s.add(g2);
  }
  // character
  if(o.char){
    const L=new GLTFLoader();const dl=new DRACOLoader();dl.setDecoderPath('/nm/three/examples/jsm/libs/draco/gltf/');L.setDRACOLoader(dl);
    const g=(await L.loadAsync('/models/'+encodeURIComponent(o.char))).scene;
    const b=new THREE.Box3().setFromObject(g),z=b.getSize(new THREE.Vector3());const sc=o.charH/z.y;g.scale.setScalar(sc);
    const b2=new THREE.Box3().setFromObject(g),c2=b2.getCenter(new THREE.Vector3());
    g.position.set(-c2.x,o.charY-b2.min.y,-c2.z);g.rotation.y=o.charYaw;
    g.traverse(m=>{if(m.isMesh){m.castShadow=true;if(m.material){m.material.envMap=envTex;m.material.envMapIntensity=0.6;}}});
    s.add(g);
    const key=new THREE.SpotLight(0xfff0d8,40,8,0.5,0.6);key.position.set(1.2,o.charY+2,3);key.target=g;s.add(key);
    const halo=new THREE.Sprite(new THREE.SpriteMaterial({map:glowSprite('rgba(255,215,140,0.5)'),blending:THREE.AdditiveBlending,depthWrite:false,transparent:true,opacity:0.3}));
    halo.scale.set(3.2,3.2,1);halo.position.set(0,o.charY+o.charH*0.55,-0.4);s.add(halo);
  }
  return s;
}

window.shoot=async(o,name)=>{
  const s=await build(o);
  const cam=new THREE.PerspectiveCamera(o.fov||34,W/H,0.05,100);cam.position.set(...o.cam);cam.lookAt(...o.look);
  const comp=new EffectComposer(r);comp.addPass(new RenderPass(s,cam));
  comp.addPass(new UnrealBloomPass(new THREE.Vector2(W,H),o.bloom??0.6,0.6,0.9));comp.addPass(new OutputPass());
  comp.render();
  await fetch('/save/'+name,{method:'POST',body:r.domElement.toDataURL('image/jpeg',0.9)});
  return 'ok '+name;
};
window.ready=true;
</script></body></html>
